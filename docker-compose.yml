# Uruchomienie lokalne: docker compose up --build  ->  http://localhost:3000
# W Coolify wystarczy sam Dockerfile (patrz README); ten plik też zadziała jako "Docker Compose".
services:
  drzazgi:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_PLAYERS: 40
      NPC_COUNT: 9
      # WORLD_SEED: 12345   # stała mapa świata (domyślnie losowa po każdym starcie)
    ports:
      - "3000:3000"
    volumes:
      - drzazgi-data:/app/data

volumes:
  drzazgi-data:
